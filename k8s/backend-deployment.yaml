apiVersion: apps/v1
kind: Deployment
metadata:
  name: concierge-backend
  labels:
    app: concierge-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concierge-backend
  template:
    metadata:
      labels:
        app: concierge-backend
    spec:
      containers:
        - name: backend
          image: realestate-backend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: concierge-config
            - secretRef:
                name: concierge-secret
          env:
            # Pin HuggingFace cache to /tmp so the pod never hits HF Hub on cold
            # start; cache survives within the container writable layer.
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_cache"
            - name: HF_HOME
              value: "/tmp/hf_cache"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: concierge-backend
spec:
  type: ClusterIP
  selector:
    app: concierge-backend
  ports:
    - name: http        # named port — required for ServiceMonitor scraping
      port: 5000
      targetPort: 5000
